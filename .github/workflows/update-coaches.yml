name: Update Pelatih & Prestasi

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-coaches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Jalankan fetch-coaches.js
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: node fetch-coaches.js

      - name: Commit & push coaches.js kalau ada perubahan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add coaches.js
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan pelatih."
          else
            git commit -m "Auto-update pelatih & prestasi $(date -u +'%Y-%m-%d')"
            git push
          fi
