name: Update Berita Transfer

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-transfers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Jalankan fetch-transfers.js
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: node fetch-transfers.js

      - name: Commit & push transfers.js kalau ada perubahan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add transfers.js
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan transfer."
          else
            git commit -m "Auto-update berita transfer $(date -u +'%Y-%m-%d')"
            git push
          fi
