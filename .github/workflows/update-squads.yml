name: Update Skuad Tim

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-squads:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Jalankan fetch-squads.js
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: node fetch-squads.js

      - name: Commit & push squads.js kalau ada perubahan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add squads.js
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan skuad."
          else
            git commit -m "Auto-update skuad tim $(date -u +'%Y-%m-%d')"
            git push
          fi
